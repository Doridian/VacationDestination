name: build

# The port for Linux (x86-64, aarch64), Windows (x86-64), macOS (universal)
# and the browser, on every push and pull request, each one file: an
# AppImage, an .exe, the app in a .dmg (README.md, "Packages"). None
# carries game data: the player gives the port the CD image (or the game's
# folder) at run time, natively from a file dialog when it isn't given
# (`pick`), in the browser on the page. A push to main also deploys the
# page to GitHub Pages (docs/web.md); a tag v* publishes every package on
# the tag's release.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        # The oldest Ubuntu LTS still in standard support, on purpose: the
        # AppImage uses the host's glibc, which has to be at least as new as
        # the one it was built against (the AppImage catalog tests on that
        # release). Not the newest runner, then; move on only when this one
        # leaves standard support. The arch as AppImage spells it.
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # (keyed by the runner image too: a target/ built on another Ubuntu
      # release doesn't load)
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config file

      - name: Build
        run: cargo build --release --locked -p vacationdestination

      - name: Package (AppImage)
        timeout-minutes: 10
        run: |
          out=vacationdestination-${{ matrix.arch }}.AppImage
          curl -sSLfo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.arch }}.AppImage
          chmod +x linuxdeploy
          doc=AppDir/usr/share/doc/vacationdestination
          mkdir -p $doc
          cp LICENSE README.md $doc/
          cp crates/vacationdestination/res/icon.png vacationdestination.png
          # the window, the GPU and the sound are the host's (dlopen'd, or
          # linuxdeploy's excludelist: libasound, libGL, libvulkan)
          LDAI_OUTPUT=$out ./linuxdeploy --appdir AppDir -e target/release/vacationdestination \
              -d crates/vacationdestination/res/vacationdestination.desktop -i vacationdestination.png --output appimage
          # (it starts: the libraries are all there)
          { ./$out --help 2>&1 || true; } | grep "usage:"

      - uses: actions/upload-artifact@v7
        with:
          name: vacationdestination-${{ matrix.arch }}.AppImage
          path: vacationdestination-${{ matrix.arch }}.AppImage

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # the C runtime linked in: the .exe needs only Windows' own DLLs
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p vacationdestination

      - name: Package
        run: |
          cp target/release/vacationdestination.exe vacationdestination-windows-x86_64.exe
          # (it starts)
          { ./vacationdestination-windows-x86_64.exe --help 2>&1 || true; } | grep "usage:"

      - uses: actions/upload-artifact@v7
        with:
          name: vacationdestination-windows-x86_64
          path: vacationdestination-windows-x86_64.exe

  macos:
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build (arm64 and x86-64)
        run: |
          cargo build --release --locked -p vacationdestination --target aarch64-apple-darwin
          cargo build --release --locked -p vacationdestination --target x86_64-apple-darwin

      - name: Package (app in a dmg)
        timeout-minutes: 10
        run: |
          app="dmg/VacationDestination.app"
          c="$app/Contents"
          mkdir -p "$c/MacOS" "$c/Resources"
          lipo -create -output "$c/MacOS/vacationdestination" \
              target/aarch64-apple-darwin/release/vacationdestination target/x86_64-apple-darwin/release/vacationdestination
          v=0.0.0
          case "$GITHUB_REF" in refs/tags/v*) v=${GITHUB_REF_NAME#v} ;; esac
          sed "s/@VERSION@/$v/" crates/vacationdestination/res/Info.plist > "$c/Info.plist"
          # the icon, from crates/vacationdestination/res/icon.png
          mkdir vacationdestination.iconset
          for n in 16 32 128 256 512; do
              sips -z $n $n crates/vacationdestination/res/icon.png --out vacationdestination.iconset/icon_${n}x${n}.png > /dev/null
              if [ $n -le 256 ]; then
                  sips -z $((n * 2)) $((n * 2)) crates/vacationdestination/res/icon.png --out vacationdestination.iconset/icon_${n}x${n}@2x.png > /dev/null
              fi
          done
          iconutil -c icns vacationdestination.iconset -o "$c/Resources/vacationdestination.icns"
          cp LICENSE README.md "$c/Resources/"
          otool -L "$c/MacOS/vacationdestination"
          lipo -info "$c/MacOS/vacationdestination"
          codesign --force --deep -s - "$app"
          # (it starts)
          { "$c/MacOS/vacationdestination" --help 2>&1 || true; } | grep "usage:"
          ln -s /Applications dmg/Applications
          hdiutil create -volname "VacationDestination" -srcfolder dmg -ov -format UDZO vacationdestination-macos.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: vacationdestination-macos
          path: vacationdestination-macos.dmg

  # The browser build (docs/web.md), without game data: the page asks the
  # player for their CD image. crates/vacationdestination/web/front.html is the front
  # page, vacationdestination.html the game next to it.
  web:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: The wasm-bindgen version the crates pin
        id: bindgen
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' crates/vacationdestination/Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      - name: Build
        run: tools/build-web.sh --out web

      - name: Assemble the site
        run: |
          # The site must never carry game data, only the port's own files.
          if find web -type f ! -name '*.js' ! -name '*.wasm' ! -name '*.html' | grep .; then
            echo "unexpected files in the build"; exit 1
          fi
          mkdir _site
          cp -r web/vacationdestination.js web/vacationdestination_bg.wasm web/snippets _site/
          cp web/index.html _site/vacationdestination.html
          cp crates/vacationdestination/web/front.html _site/index.html
          d=vacationdestination-web
          cp -r _site $d
          cp LICENSE README.md $d/
          zip -r $d.zip $d

      - uses: actions/upload-artifact@v7
        with:
          name: vacationdestination-web
          path: vacationdestination-web.zip

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, web]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish on the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          gh release upload "$TAG" dist/* --clobber
